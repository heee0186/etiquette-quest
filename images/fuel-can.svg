<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="별 표시가 있는 버스 연료통">
  <!-- 모험 버스와 같은 그림체: 납작한 면, 굵은 회남색 테두리(#424851), 안쪽 밝은 선.
       빨강은 버스 후미등, 노랑은 전조등·행선판, 짙은 회색은 버스 거울과 같은 색 -->
  <defs>
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f47c66"/><stop offset=".5" stop-color="#e75a45"/><stop offset="1" stop-color="#c13f2d"/></linearGradient>
    <linearGradient id="canFuel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a3"/><stop offset="1" stop-color="#f7bd3f"/></linearGradient>
  </defs>
  <!-- 반짝이 -->
  <polygon points="298.0,31.0 301.0,41.0 311.0,44.0 301.0,47.0 298.0,57.0 295.0,47.0 285.0,44.0 295.0,41.0" fill="#ffd86d" stroke="#c89322" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="40.0,118.0 42.3,125.7 50.0,128.0 42.3,130.3 40.0,138.0 37.7,130.3 30.0,128.0 37.7,125.7" fill="#ffd86d" stroke="#c89322" stroke-width="3" stroke-linejoin="round"/>
  <!-- 손잡이 (세 줄 손잡이의 앞줄) -->
  <path d="M96 92 V62 Q96 46 112 46 H164 Q180 46 180 62 V92" fill="none" stroke="#424851" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 92 V62 Q96 46 112 46 H164 Q180 46 180 62 V92" fill="none" stroke="#c13f2d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 주입구와 뚜껑 -->
  <g transform="translate(-9 9) rotate(34 232 96)">
    <rect x="214" y="62" width="36" height="34" rx="5" fill="#48545f" stroke="#303941" stroke-width="5"/>
    <rect x="207" y="50" width="50" height="18" rx="8" fill="#ffd86d" stroke="#c89322" stroke-width="4"/>
  </g>
  <!-- 몸통 -->
  <path d="M90 88 H196 L256 128 V256 Q256 280 232 280 H90 Q66 280 66 256 V112 Q66 88 90 88 Z" fill="url(#canBody)" stroke="#424851" stroke-width="5" stroke-linejoin="round"/>
  <path d="M82 250 V116 Q82 104 94 104 H150" fill="none" stroke="#ffc2b3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
  <!-- 옆면 X자 눌림 무늬 -->
  <rect x="88" y="126" width="112" height="134" rx="14" fill="none" stroke="#aa3a2a" stroke-width="4" opacity=".7"/>
  <path d="M102 140 L186 246 M186 140 L102 246" fill="none" stroke="#aa3a2a" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <!-- 별 표시 -->
  <polygon points="144.0,155.0 154.0,179.2 180.1,181.3 160.2,198.3 166.3,223.7 144.0,210.0 121.7,223.7 127.8,198.3 107.9,181.3 134.0,179.2" fill="#ffd86d" stroke="#c89322" stroke-width="5" stroke-linejoin="round"/>
  <path d="M130 184 L139 177" fill="none" stroke="#fff6cf" stroke-width="5" stroke-linecap="round"/>
  <!-- 연료 눈금창 -->
  <rect x="216" y="142" width="24" height="118" rx="12" fill="#2f3a46" stroke="#424851" stroke-width="4"/>
  <rect x="222" y="188" width="12" height="66" rx="6" fill="url(#canFuel)"/>
  <path d="M206 160 H212 M206 188 H212 M206 216 H212 M206 244 H212" fill="none" stroke="#7d2a1e" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
